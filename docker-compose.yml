version: '3.8'

services:
    server:
        image: teri1712/decade-course-management:latest
        #        build:
        #            context: .
        #            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            DB_HOST: mysql

        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: QuanLySinhVien
        ports:
            - "3306:3306"
        volumes:
            - ./mysql-init:/docker-entrypoint-initdb.d
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1" ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s